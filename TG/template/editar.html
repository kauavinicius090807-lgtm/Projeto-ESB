<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Livro - Biblioteca ESB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="logo">📚 Biblioteca ESB</div>
        <nav><a href="/">Início</a></nav>
    </header>

    <main>
        <section class="cadastro">
            <h2>✏️ Editar Livro</h2>
            <form action="/editar/{{ livro_id }}" method="POST">
                <div class="campo">
                    <label>Título</label>
                    <input type="text" name="titulo" value="{{ livro.titulo }}" required>
                </div>
                <div class="campo">
                    <label>Autor</label>
                    <input type="text" name="autor" value="{{ livro.autor }}" required>
                </div>
                <div class="campo">
                    <label>Categoria / Gênero</label>
                    <input type="text" name="categoria" value="{{ livro.categoria }}" required>
                </div>
                <div class="campo" style="flex-direction: row; align-items: center; gap: 10px;">
                    <input type="checkbox" name="disponivel" id="disponivel" {% if livro.disponivel %}checked{% endif %} style="width: 20px; height: 20px;">
                    <label for="disponivel" style="margin: 0; cursor: pointer;">Livro disponível</label>
                </div>
                <button type="submit">Salvar Alterações</button>
            </form>
        </section>
    </main>
</body>
</html>
